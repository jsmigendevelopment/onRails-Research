<rect x="807" y="42" width="122" height="44" rx="22" fill="#23142b" stroke="#cfb6c2" stroke-opacity=".45"/><circle cx="829" cy="64" r="6" fill="#cfb6c2"/><text x="843" y="70" font-family="Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#cfb6c2">anecdote</text>

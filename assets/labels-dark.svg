<rect x="322" y="138" width="95" height="44" rx="22" fill="#0f2c22" stroke="#5fe39a" stroke-opacity=".45"/><circle cx="344" cy="160" r="6" fill="#5fe39a"/><text x="358" y="166" font-family="Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#5fe39a">fresh</text>

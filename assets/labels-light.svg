<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 236" width="1200" height="236" role="img" aria-label="The trust labels. How a claim is known: measured, read-in-source, vendor-claim, anecdote, summary-only. How fresh a dossier is: fresh, due soon, stale. Who checked it: cross-checked or fact-checked.">
<title>The trust labels. How a claim is known: measured, read-in-source, vendor-claim, anecdote, summary-only. How fresh a dossier is: fresh, due soon, stale. Who checked it: cross-checked or fact-checked.</title>
<defs><style>@media (prefers-reduced-motion: reduce){.m{animation:none!important}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.swirl{transform-box:fill-box;transform-origin:center;animation:spin 20s linear infinite reverse}
.pulse{animation:flow 9s linear infinite}
.breathe{animation:breathe 6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{from{stroke-dashoffset:1600}to{stroke-dashoffset:0}}
@keyframes breathe{50%{opacity:.75}}</style></defs>
<rect width="1200" height="236" rx="24" fill="#ffffff" stroke="#f3dfcb"/><path d="M48 112H1152" stroke="#f2d6bd"/>

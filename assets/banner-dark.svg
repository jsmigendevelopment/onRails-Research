<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="onRails Research: the open research commons. Every claim sourced, model and effort recorded, fact-checked and dated.">
<title>onRails Research: the open research commons. Every claim sourced, model and effort recorded, fact-checked and dated.</title>
<defs><linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1426"/><stop offset="1" stop-color="#170d1c"/></linearGradient>
<linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#a3125c"/></linearGradient><radialGradient id="ob" cx="34%" cy="30%" r="75%"><stop offset="0" stop-color="#fff3c4"/><stop offset=".2" stop-color="#ffc24d"/><stop offset=".58" stop-color="#ff7a45"/><stop offset="1" stop-color="#b0125e"/></radialGradient>
<radialGradient id="og"><stop offset=".45" stop-color="#ff9628" stop-opacity="0.5"/><stop offset="1" stop-color="#ff9628" stop-opacity="0"/></radialGradient>
<radialGradient id="os" cx="70%" cy="74%" r="60%"><stop offset="0" stop-color="#000000" stop-opacity="0.5"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient><style>@media (prefers-reduced-motion: reduce){.m{animation:none!important}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.swirl{transform-box:fill-box;transform-origin:center;animation:spin 20s linear infinite reverse}
.pulse{animation:flow 9s linear infinite}
.breathe{animation:breathe 6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{from{stroke-dashoffset:1600}to{stroke-dashoffset:0}}
@keyframes breathe{50%{opacity:.75}}</style></defs>
<rect width="1200" height="400" rx="28" fill="url(#page)"/>
<path d="M-20 120C220 30 430 260 700 160S1080 40 1220 150" fill="none" stroke="#472944" stroke-width="1.5"/><path class="m pulse" d="M-20 120C220 30 430 260 700 160S1080 40 1220 150" fill="none" stroke="#ff6fb0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="60 1540" style="animation-delay:0s" opacity=".8"/>
<path d="M-20 330C240 250 460 420 760 330S1100 250 1220 340" fill="none" stroke="#472944" stroke-width="1.5"/><path class="m pulse" d="M-20 330C240 250 460 420 760 330S1100 250 1220 340" fill="none" stroke="#ff6fb0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="60 1540" style="animation-delay:-4.5s" opacity=".8"/>
<rect x="24" y="24" width="768" height="352" rx="22" fill="url(#hero)"/>
<text x="64" y="86" font-family="Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.4" fill="#ffffff" opacity=".85">ONRAILS · RESEARCH COMMONS</text>
<text x="62" y="170" font-family="'Bricolage Grotesque','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="-1.4" fill="#ffffff">onRails Research</text>
<text x="64" y="226" font-family="'Bricolage Grotesque','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="-.3" fill="#ffffff">Research anyone can check.</text>
<text x="64" y="264" font-family="Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="18" fill="#ffffff" opacity=".9">Open dossiers, added by pull request, kept fresh.</text>
<rect x="64" y="300" width="192" height="34" rx="17" fill="#23142b" stroke="none"/><text x="160" y="322.25" text-anchor="middle" font-family="Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#fff3e6">Every claim sourced</text>
<rect x="268" y="300" width="242" height="34" rx="17" fill="#23142b" stroke="none"/><text x="389" y="322.25" text-anchor="middle" font-family="Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#fff3e6">Model and effort recorded</text>
<rect x="522" y="300" width="217" height="34" rx="17" fill="#23142b" stroke="none"/><text x="630.5" y="322.25" text-anchor="middle" font-family="Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#fff3e6">Fact-checked and dated</text>
<rect x="816" y="24" width="360" height="352" rx="22" fill="#23142b" stroke="#40263f"/>
<path d="M792 112h24" stroke="#9a5a3c" stroke-width="2"/><circle class="m breathe" cx="804" cy="112" r="4" fill="#ff6fb0"/>
<circle class="m breathe" cx="1008" cy="196" r="148.2" fill="url(#og)"/>
<circle class="m spin" cx="1008" cy="196" r="98.28" fill="none" stroke="#9a5a3c" stroke-width="1.5" stroke-dasharray="5 7"/>
<circle cx="1008" cy="196" r="78" fill="url(#ob)"/>
<circle cx="1008" cy="196" r="78" fill="url(#os)"/>
<g transform="translate(930 118) scale(1.56)"><g class="m swirl" stroke="#ffe6a8" opacity=".8"><rect width="100" height="100" fill="none" stroke="none"/><path d="M22 58c6-22 30-34 52-22" fill="none" stroke-linecap="round" stroke-width="1.60"/><path d="M30 76c18 6 40-4 46-24" fill="none" stroke-linecap="round" stroke-width="1.60"/><g stroke="#fff3c4" opacity=".7"><path d="M36 30c10-8 26-8 34 2" fill="none" stroke-linecap="round" stroke-width="1.60"/></g></g></g>
<text x="996" y="338" text-anchor="middle" font-family="Figtree,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#cfb6c2">Re-checked on a schedule</text>
</svg>
